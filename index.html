*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#08090a;--s1:#101113;--s2:#17181b;--s3:#202226;--s4:#2a2c31;
  --b1:rgba(255,255,255,.08);--b2:rgba(255,255,255,.14);--b3:rgba(255,255,255,.26);
  --acc:#c8ff00;--acd:rgba(200,255,0,.09);--acb:rgba(200,255,0,.3);
  --p1:#c8ff00;--p1d:rgba(200,255,0,.09);
  --p2:#5cc8ff;--p2d:rgba(92,200,255,.10);
  --amb:#ffb224;--ad:rgba(255,178,36,.11);
  --red:#ff5a45;--rdd:rgba(255,90,69,.12);
  /* legacy names used by inline styles */
  --gold:var(--acc);--gd:var(--acd);--gb:var(--acb);
  --teal:var(--p1);--td:var(--p1d);
  --pur:var(--p2);--pd:var(--p2d);
  --grn:var(--acc);--grd:var(--acd);
  --t1:#f2f2ee;--t2:#b0b0b5;--t3:#85858b;
  --fd:'Bebas Neue',sans-serif;--fb:'Barlow Condensed',sans-serif;--fm:'IBM Plex Mono',monospace;
  --r:6px;--rl:10px;--rs:4px;
  --gut:clamp(14px,3vw,24px);
  --hdr:56px;
}
html{-webkit-text-size-adjust:100%}
html,body{min-height:100%;background:var(--bg);color:var(--t1);font-family:var(--fb);-webkit-font-smoothing:antialiased;font-size:16px;line-height:1.35}
body{overflow-x:hidden}
#root{min-height:100vh;min-height:100dvh}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--s4);border-radius:3px}
input,button,select{font-family:var(--fb);font-size:inherit;color:inherit}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button{opacity:.3}
button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.fi:focus-visible,.bet-num-inp:focus-visible{outline-offset:0}
strong{font-weight:600}

/* ───────── SETUP ───────── */
.setup{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:clamp(20px,5vw,48px) var(--gut);position:relative;overflow:hidden}
.setup-glow{position:absolute;inset:0;background:radial-gradient(ellipse 70% 40% at 50% -5%,rgba(200,255,0,.07),transparent);pointer-events:none}
.setup-inner{width:100%;max-width:620px;position:relative;z-index:1}
.logo{font-family:var(--fd);font-size:clamp(56px,16vw,88px);font-weight:400;letter-spacing:.18em;padding-left:.18em;color:var(--acc);text-align:center;line-height:1;text-shadow:0 0 60px rgba(200,255,0,.28)}
.logo-sub{text-align:center;font-size:15px;letter-spacing:.06em;color:var(--t3);margin:8px 0 clamp(24px,5vw,40px)}
.panel{background:var(--s1);border:1px solid var(--b1);border-radius:var(--rl);overflow:hidden;margin-bottom:14px}
.ph{padding:12px 18px;border-bottom:1px solid var(--b1);display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--s2)}
.ph-title{font-size:15px;font-weight:600;letter-spacing:.03em;color:var(--t1)}
.ph-sub{font-family:var(--fm);font-size:12px;color:var(--t3)}
.pb{padding:18px}
.irow{display:flex;gap:8px}
.fi{width:100%;min-width:0;background:var(--s2);border:1px solid var(--b2);border-radius:var(--r);color:var(--t1);font-size:16px;padding:10px 12px;min-height:42px;transition:border-color .15s}
.fi:focus{border-color:var(--acc)}
.fi::placeholder{color:var(--t3)}
.fi.mono{font-family:var(--fm);font-size:15px}
.lbl{display:block;font-size:14px;font-weight:500;color:var(--t2);margin-bottom:6px}
.field-hint{font-size:13px;color:var(--t3);margin-top:5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;min-height:30px}
.chips-empty{font-size:14px;color:var(--t3);align-self:center}
.chip{display:inline-flex;align-items:center;gap:2px;background:var(--s3);border:1px solid var(--b2);border-radius:999px;padding:2px 4px 2px 12px;font-size:15px;max-width:100%;animation:ci .2s ease}
.chip>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes ci{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:scale(1)}}
.chip-rm{background:none;border:none;color:var(--t3);cursor:pointer;font-size:18px;width:28px;height:28px;border-radius:50%;line-height:1;transition:color .15s,background .15s}
.chip-rm:hover{color:var(--red);background:var(--rdd)}
.cfg{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fmt-badge{display:flex;width:100%;align-items:center;gap:8px;padding:0 12px;min-height:42px;border-radius:var(--r);font-family:var(--fm);font-size:13px;border:1px solid var(--b2);background:var(--s2)}
.fmt-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.setup-footer{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:6px}
.setup-meta{font-size:14px;color:var(--t3);line-height:1.5}
.rule-box{background:var(--s2);border-radius:var(--rs);border-left:3px solid var(--acb);padding:10px 14px;margin-top:14px;font-size:14px;color:var(--t3);line-height:1.6}
.rule-box strong{color:var(--t2)}

/* ───────── BUTTONS ───────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 18px;min-height:42px;border-radius:var(--r);font-size:15px;font-weight:600;cursor:pointer;transition:background .13s,border-color .13s,color .13s;border:1px solid transparent;line-height:1;text-align:center}
.btn-gold{background:var(--acc);color:#0a0b00}
.btn-gold:hover{background:#d8ff40}
.btn-gold:disabled{opacity:.35;cursor:not-allowed}
.btn-out{background:transparent;border-color:var(--b2);color:var(--t2)}
.btn-out:hover{border-color:var(--t2);color:var(--t1)}
.btn-ghost{background:transparent;border:1px solid var(--b2);color:var(--t2);font-size:15px;min-height:42px;padding:0 20px;border-radius:var(--r);cursor:pointer;transition:all .13s}
.btn-ghost:hover{border-color:var(--t2);color:var(--t1)}
.btn-lg{min-height:50px;padding:0 28px;font-size:20px;font-family:var(--fd);font-weight:400;letter-spacing:.08em}
.btn-sm{min-height:42px;padding:0 16px;font-size:14px}

/* ───────── APP SHELL ───────── */
.app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.app-hdr{background:rgba(8,9,10,.88);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--b1);padding:0 var(--gut);height:var(--hdr);display:flex;align-items:center;gap:clamp(10px,2vw,20px);position:sticky;top:0;z-index:30;flex-shrink:0}
.app-logo{font-family:var(--fd);font-size:26px;letter-spacing:.16em;color:var(--acc);flex-shrink:0;line-height:1}
.hdr-prog-wrap{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.hdr-bar{flex:1;height:3px;background:var(--s3);border-radius:2px;overflow:hidden}
.hdr-fill{height:100%;background:var(--acc);border-radius:2px;transition:width .5s ease}
.hdr-lbl{font-family:var(--fm);font-size:12px;color:var(--t3);flex-shrink:0;white-space:nowrap}
.hdr-chips{display:flex;gap:6px;flex-shrink:0}
.hdr-chip{font-family:var(--fm);font-size:12px;padding:4px 10px;border-radius:999px;white-space:nowrap}
.hdr-chip.rr{background:var(--pd);color:var(--pur)}
.hdr-chip.sw{background:var(--td);color:var(--teal)}
.hdr-chip.gaunt{background:var(--gd);color:var(--gold)}
.hdr-chip.finals{background:var(--ad);color:var(--amb)}
.hdr-chip.eco-ok{background:var(--grd);color:var(--grn)}
.hdr-chip.eco-warn{background:var(--rdd);color:var(--red)}
.hdr-chip.eco-hi{background:var(--ad);color:var(--amb)}

.app-body{flex:1;display:grid;grid-template-columns:minmax(0,1fr);min-height:0}
.app-main{padding:var(--gut);display:flex;flex-direction:column;gap:14px;min-width:0}
.app-main>*{width:100%;max-width:880px;margin-inline:auto}
.app-side{border-top:1px solid var(--b1);display:flex;flex-direction:column;background:var(--s1);min-width:0}

@media (min-width:960px){
  .app{height:100vh;height:100dvh}
  .app-body{grid-template-columns:minmax(0,1fr) clamp(280px,26vw,360px);overflow:hidden}
  .app-main{overflow-y:auto}
  .app-side{border-top:none;border-left:1px solid var(--b1);overflow:hidden}
}
@media (max-width:959px){
  .app-side .side-sec{flex:none!important;min-height:0!important}
  .app-side .side-scroll{max-height:280px}
}

/* ───────── CARD ───────── */
.card{background:var(--s1);border:1px solid var(--b1);border-radius:var(--rl);overflow:hidden}
.card-h{padding:12px 18px;border-bottom:1px solid var(--b1);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--s2)}
.card-title{font-size:15px;font-weight:600;letter-spacing:.03em;color:var(--t1)}
.card-sub{font-family:var(--fm);font-size:12px;color:var(--t3)}
.card-body{padding:18px}

/* ───────── MATCH ARENA ───────── */
.match-arena{display:grid;grid-template-columns:minmax(0,1fr) clamp(52px,9vw,76px) minmax(0,1fr);align-items:stretch;min-height:140px}
.arena-side{display:flex;flex-direction:column;justify-content:center;gap:6px;padding:clamp(18px,3.5vw,28px) clamp(12px,3vw,24px);min-width:0}
.arena-side.left{align-items:flex-end;text-align:right;background:linear-gradient(90deg,transparent,var(--p1d))}
.arena-side.right{align-items:flex-start;text-align:left;background:linear-gradient(270deg,transparent,var(--p2d))}
.arena-name{font-family:var(--fd);font-size:clamp(26px,5.5vw,42px);letter-spacing:.04em;color:var(--t1);line-height:1.05;overflow-wrap:anywhere;max-width:100%}
.arena-bal{font-family:var(--fm);font-size:clamp(17px,3.5vw,22px);font-weight:500}
.arena-side.left .arena-bal{color:var(--p1)}
.arena-side.right .arena-bal{color:var(--p2)}
.arena-record{font-size:14px;color:var(--t3)}
.arena-vs{display:flex;flex-direction:column;align-items:center;justify-content:center}
.arena-vs-txt{font-family:var(--fd);font-size:clamp(18px,3.5vw,24px);letter-spacing:.1em;color:var(--t3);padding:10px 0}
.arena-divider{width:1px;flex:1;background:linear-gradient(to bottom,transparent,var(--b2),transparent)}
.arena-reward-row{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px 22px;padding:12px 18px;font-size:15px;color:var(--t2);border-top:1px solid var(--b1)}
.arena-reward-row .ar-grn{font-family:var(--fm);color:var(--grn);font-weight:600;margin-left:4px}
.arena-reward-row .ar-red{font-family:var(--fm);color:var(--red);font-weight:600;margin-left:4px}
.arena-reward-row .ar-dim{font-family:var(--fm);color:var(--t2);margin-left:4px}

/* finals players */
.match-vs{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:18px}
.mp{background:var(--s2);border:1px solid var(--b1);border-radius:var(--r);padding:16px 12px;text-align:center;min-width:0}
.mp:first-child{border-top:3px solid var(--p1)}
.mp:last-child{border-top:3px solid var(--p2)}
.mp.ghost-p{opacity:.5;border-style:dashed;border-top-width:1px}
.mp-name{font-family:var(--fd);font-size:clamp(22px,4.5vw,30px);letter-spacing:.04em;margin-bottom:8px;overflow-wrap:anywhere}
.mp-stats{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.sc{font-family:var(--fm);font-size:12px;padding:3px 8px;border-radius:4px}
.sc-t{background:var(--td);color:var(--teal)}
.sc-w{background:var(--grd);color:var(--grn)}
.sc-l{background:var(--rdd);color:var(--red)}

/* ───────── BETTING ───────── */
.bet-grid{display:flex;flex-direction:column;gap:1px;background:var(--b1)}
.bet-item{display:grid;grid-template-columns:minmax(110px,170px) minmax(0,1fr) minmax(64px,auto);align-items:center;gap:8px 14px;padding:10px 18px;background:var(--s1);transition:background .15s}
.bet-item:hover{background:var(--s2)}
.bet-who{min-width:0}
.bet-item-name{font-size:16px;font-weight:600;color:var(--t1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bet-item-bal{font-family:var(--fm);font-size:12px;color:var(--t3);white-space:nowrap}
.bet-item-right{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;min-width:0}
.bet-side-group{display:flex;gap:6px;min-width:0}
.side-btn{padding:0 12px;min-height:36px;border-radius:var(--rs);border:1px solid var(--b2);background:var(--s2);color:var(--t2);font-size:15px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis}
.side-btn:hover:not(:disabled){border-color:var(--b3);color:var(--t1)}
.side-btn.active-p1{background:var(--p1d);border-color:var(--p1);color:var(--p1)}
.side-btn.active-p2{background:var(--p2d);border-color:var(--p2);color:var(--p2)}
.side-btn:disabled{opacity:.35;cursor:not-allowed}
.bet-amount-wrap{display:flex;align-items:center;gap:8px;flex:1;min-width:200px}
.bet-slider{-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:var(--s4);flex:1;min-width:60px;cursor:pointer}
.bet-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:20px;height:20px;border-radius:50%;background:var(--acc);cursor:pointer;border:3px solid var(--s1)}
.bet-slider::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--acc);cursor:pointer;border:3px solid var(--s1)}
.bet-num-inp{width:64px;background:var(--s3);border:1px solid var(--b2);border-radius:var(--rs);color:var(--t1);font-family:var(--fm);font-size:14px;padding:0 6px;min-height:36px;text-align:right}
.bet-num-inp:focus{border-color:var(--acc)}
.bet-quick{display:flex;gap:4px}
.bet-pct-btn{padding:0 8px;min-height:36px;border-radius:var(--rs);border:1px solid var(--b1);background:var(--s3);color:var(--t2);font-family:var(--fm);font-size:12px;cursor:pointer;transition:all .15s}
.bet-pct-btn:hover{border-color:var(--acc);color:var(--acc)}
.bet-ret-tag{font-family:var(--fm);font-size:13px;text-align:right;white-space:nowrap}
.bet-ret-tag.pos{color:var(--grn)}
.bet-ret-tag.zero{color:var(--t3)}
/* locked */
.bet-row-lk{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;padding:10px 18px;border-bottom:1px solid var(--b1)}
.bet-row-lk:last-child{border-bottom:none}
.bet-lk-name{font-size:16px;font-weight:600;flex:1;min-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bet-lk-pick{font-family:var(--fm);font-size:12px;padding:3px 9px;border-radius:4px;background:var(--gd);color:var(--gold);flex-shrink:0;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bet-lk-amt{font-family:var(--fm);font-size:12px;color:var(--t3);flex-shrink:0}
.bet-lk-ret{font-family:var(--fm);font-size:12px;margin-left:auto;flex-shrink:0}
.bet-lk-ret.p{color:var(--teal)}.bet-lk-ret.z{color:var(--t3)}
.bet-no{font-size:14px;color:var(--t3);margin-left:auto}

.fav-note{padding:10px 18px;font-size:14px;color:var(--amb);background:var(--ad);border-bottom:1px solid var(--b1);line-height:1.45}

.presets{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:14px}
.preset{min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--b2);background:transparent;color:var(--t2);font-size:15px;font-weight:500;cursor:pointer;transition:all .13s}
.preset:hover{border-color:var(--b3);color:var(--t1)}
.preset.on{background:var(--acd);border-color:var(--acb);color:var(--acc)}

/* pot */
.pot-grid{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--b1)}
.pot-s{padding:16px 18px;text-align:center;min-width:0}
.pot-s:first-child{border-right:1px solid var(--b1);background:linear-gradient(180deg,var(--p1d),transparent)}
.pot-s:last-child{background:linear-gradient(180deg,var(--p2d),transparent)}
.pot-s-name{font-size:14px;color:var(--t2);margin-bottom:4px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pot-s-amt{font-family:var(--fd);font-size:clamp(28px,5vw,36px);letter-spacing:.03em;color:var(--p1);line-height:1.1}
.pot-s:last-child .pot-s-amt{color:var(--p2)}
.pot-s-meta{font-size:13px;color:var(--t3);margin-top:2px}
.pot-s-odds{font-family:var(--fm);font-size:13px;color:var(--t2);margin-top:4px}
.pot-s.vig .pot-s-odds{color:var(--red)}

/* lock bar + winner */
.lock-bar{padding:14px 18px;border-top:1px solid var(--b1);display:flex;align-items:center;justify-content:space-between;gap:12px 16px;flex-wrap:wrap}
.lock-hint{font-size:14px;color:var(--t3);line-height:1.45;flex:1;min-width:200px}
.locked-badge{font-size:13px;font-weight:600;padding:4px 12px;border-radius:999px;background:var(--grd);color:var(--grn)}
.win-btns{display:grid;grid-template-columns:1fr 1fr}
.win-btn{padding:clamp(18px,3.5vw,26px) 14px;background:transparent;border:none;border-top:1px solid var(--b1);color:var(--t2);font-family:var(--fd);font-size:clamp(20px,4vw,28px);cursor:pointer;transition:color .18s,background .18s;letter-spacing:.05em;text-align:center;overflow-wrap:anywhere;min-height:64px}
.win-btn:first-child:not(:last-child){border-right:1px solid var(--b1)}
.win-btn:first-child:hover{color:var(--p1);background:var(--p1d)}
.win-btn:last-child:not(:first-child):hover{color:var(--p2);background:var(--p2d)}
.win-btn:only-child:hover{color:var(--p1);background:var(--p1d)}

/* ───────── RESULT OVERLAY ───────── */
.result-overlay{position:fixed;inset:0;background:rgba(5,6,7,.82);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:100;padding:var(--gut)}
.result-card{background:var(--s1);border:1px solid var(--b2);border-radius:var(--rl);width:100%;max-width:500px;max-height:100%;overflow-y:auto;animation:rcIn .3s cubic-bezier(.22,.68,0,1.2)}
@keyframes rcIn{from{opacity:0;transform:scale(.94) translateY(12px)}to{opacity:1;transform:scale(1) translateY(0)}}
.result-winner-wrap{padding:clamp(24px,6vw,36px) 20px 24px;text-align:center;background:linear-gradient(to bottom,var(--acd),transparent);border-bottom:1px solid var(--b1)}
.result-label{font-size:14px;color:var(--t3);margin-bottom:8px}
.result-winner-name{font-family:var(--fd);font-size:clamp(40px,11vw,64px);letter-spacing:.05em;color:var(--acc);line-height:1;margin-bottom:16px;overflow-wrap:anywhere}
.result-winner-name.ghost-win{color:var(--t3);font-size:32px}
.result-badges-row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.rb{display:inline-flex;align-items:center;padding:4px 12px;border-radius:999px;font-family:var(--fm);font-size:12px;font-weight:500}
.rb.win{background:var(--grd);color:var(--grn);border:1px solid var(--acb)}
.rb.lose{background:var(--rdd);color:var(--red);border:1px solid rgba(255,90,69,.3)}
.rb.tax{background:var(--s3);color:var(--t2);border:1px solid var(--b1)}
.rb.vig{background:var(--ad);color:var(--amb);border:1px solid rgba(255,178,36,.3)}
.rb.comp{background:var(--pd);color:var(--pur);border:1px solid rgba(92,200,255,.3)}
.result-economy{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--b1)}
.eco-cell{padding:16px 8px;text-align:center;border-right:1px solid var(--b1);min-width:0}
.eco-cell:last-child{border-right:none}
.eco-cell-lbl{font-size:13px;color:var(--t3);margin-bottom:4px}
.eco-cell-val{font-family:var(--fd);font-size:clamp(22px,6vw,28px);letter-spacing:.03em}
.eco-cell-val.pos{color:var(--grn)}
.eco-cell-val.neg{color:var(--red)}
.eco-cell-val.neu{color:var(--t2)}
.result-bets-hd{padding:10px 18px;font-size:14px;font-weight:600;color:var(--t2);background:var(--s2)}
.bet-result-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 18px;border-top:1px solid var(--b1)}
.bet-result-name{font-size:16px;color:var(--t1);min-width:0;overflow:hidden;text-overflow:ellipsis}
.bet-result-delta{font-family:var(--fm);font-size:14px;font-weight:500;flex-shrink:0}
.bet-result-delta.win{color:var(--grn)}
.bet-result-delta.lose{color:var(--red)}
.result-actions{padding:16px 18px;display:flex;justify-content:flex-end;gap:10px;border-top:1px solid var(--b1)}

/* ───────── SIDEBAR ───────── */
.side-sec{display:flex;flex-direction:column;border-bottom:1px solid var(--b1);min-height:0}
.side-hdr{padding:11px 16px;font-size:15px;font-weight:600;letter-spacing:.03em;color:var(--t1);border-bottom:1px solid var(--b1);flex-shrink:0;background:var(--s2);display:flex;align-items:center;justify-content:space-between}
.side-scroll{overflow-y:auto;flex:1;min-height:0}
.st-row{display:flex;align-items:center;gap:8px;padding:9px 16px;border-bottom:1px solid var(--b1);transition:background .1s}
.st-row:last-child{border-bottom:none}
.st-row:hover{background:rgba(255,255,255,.025)}
.st-row:first-child{background:var(--acd)}
.st-rank{font-family:var(--fm);font-size:12px;color:var(--t3);width:24px;flex-shrink:0}
.st-name{flex:1;min-width:0;font-size:15px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-bal{font-family:var(--fm);font-size:12px;padding:2px 8px;border-radius:4px;background:var(--p1d);color:var(--teal);flex-shrink:0}
.st-wl{font-family:var(--fm);font-size:12px;color:var(--t3);flex-shrink:0}
.st-net{font-family:var(--fm);font-size:12px;flex-shrink:0;min-width:36px;text-align:right}
.st-net.up{color:var(--grn)}.st-net.dn{color:var(--red)}.st-net.flat{color:var(--t3)}
.sch-row{display:flex;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px solid var(--b1);font-size:14px}
.sch-num{font-family:var(--fm);font-size:12px;color:var(--t3);width:20px;flex-shrink:0}
.sch-m{flex:1;min-width:0;color:var(--t2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sch-m.now{color:var(--t1);font-weight:600}
.sch-s{font-family:var(--fm);font-size:12px;flex-shrink:0}
.sch-s.done{color:var(--grn)}.sch-s.now{color:var(--gold)}.sch-s.up{color:var(--t3)}

/* economy widget */
.eco-widget{padding:14px 16px;flex-shrink:0}
.eco-bar{height:4px;background:var(--s3);border-radius:2px;position:relative;margin:10px 0 6px}
.eco-zone{position:absolute;top:-2px;height:8px;background:var(--grd);border-radius:2px;opacity:.5}
.eco-marker{position:absolute;top:-4px;width:4px;height:12px;border-radius:2px;transition:left .5s ease;transform:translateX(-50%)}
.eco-labels{display:flex;justify-content:space-between;font-family:var(--fm);font-size:11px;color:var(--t3)}

/* ───────── CHAMPION ───────── */
.champ-screen{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:clamp(28px,6vw,56px) var(--gut);text-align:center;position:relative;overflow:hidden}
.champ-glow{position:absolute;inset:0;background:radial-gradient(ellipse 90% 55% at 50% 0%,rgba(200,255,0,.1),transparent);pointer-events:none}
.champ-screen>*{position:relative}
.champ-star{font-size:clamp(44px,10vw,64px);color:var(--acc);margin-bottom:10px;animation:fu .5s ease}
@keyframes fu{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.champ-tag{font-size:16px;letter-spacing:.06em;color:var(--t2);margin-bottom:4px}
.champ-name{font-family:var(--fd);font-size:clamp(48px,14vw,96px);letter-spacing:.05em;line-height:1;animation:fu .5s .1s ease both;margin-bottom:10px;overflow-wrap:anywhere;max-width:100%}
.champ-sub{font-size:16px;color:var(--t2);margin-bottom:28px;max-width:46ch}
.champ-tbl{width:100%;max-width:560px;background:var(--s1);border:1px solid var(--b1);border-radius:var(--rl);overflow:hidden;margin-bottom:24px;text-align:left}
.champ-row{display:grid;grid-template-columns:30px minmax(0,1fr) 60px 30px 30px 52px;gap:6px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--b1)}
.champ-row:last-child{border-bottom:none}
.champ-row.top{background:var(--gd)}
.champ-row.champ-head{background:var(--s2);font-size:13px;font-weight:600;color:var(--t3)}
.champ-row.champ-head span:nth-child(n+3){text-align:right}
.champ-row .num{font-family:var(--fm);font-size:13px;text-align:right}
.champ-row-rank{font-family:var(--fm);font-size:12px;color:var(--t3)}
.champ-row-name{font-size:16px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.champ-row.top .champ-row-name{color:var(--gold)}

/* ───────── ROUND END ───────── */
.rend{display:flex;flex-direction:column;gap:14px}
.rend-banner{background:var(--pd);border:1px solid rgba(92,200,255,.25);border-radius:var(--rl);padding:16px 18px}
.rend-tag{font-size:14px;color:var(--pur);font-weight:600;margin-bottom:4px}
.rend-title{font-family:var(--fd);font-size:clamp(26px,5vw,34px);letter-spacing:.05em;color:var(--t1);margin-bottom:2px;line-height:1.1}
.rend-sub{font-size:15px;color:var(--t2)}
.card-foot{padding:14px 18px;display:flex;justify-content:flex-end}
.rend-table{width:100%;border-collapse:collapse;font-size:15px}
.rend-table th{font-size:13px;font-weight:600;color:var(--t3);padding:10px 12px;text-align:left;border-bottom:1px solid var(--b1);white-space:nowrap}
.rend-table td{padding:9px 12px;border-bottom:1px solid var(--b1);font-family:var(--fm);font-size:14px;vertical-align:middle;white-space:nowrap}
.rend-table tr:last-child td{border-bottom:none}
.rend-table tr:hover td{background:rgba(255,255,255,.02)}
.rank-badge{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-family:var(--fm);font-size:12px;font-weight:700}
.rank-1{background:rgba(200,255,0,.18);color:var(--gold);border:1px solid rgba(200,255,0,.45)}
.rank-2{background:rgba(190,195,210,.12);color:#c3c7d4;border:1px solid rgba(190,195,210,.3)}
.rank-3{background:rgba(205,127,50,.14);color:#e0924f;border:1px solid rgba(205,127,50,.35)}
.rank-rest{background:var(--s3);color:var(--t3);border:1px solid var(--b1)}
tr.top-row td{background:var(--acd)}

/* ───────── TOOLS BAR ───────── */
.tools{display:flex;gap:8px;padding:8px var(--gut);border-bottom:1px solid var(--b1);background:var(--s1);overflow-x:auto;flex-shrink:0;scrollbar-width:thin}
.tool-btn{flex-shrink:0;min-height:36px;padding:0 14px;border-radius:var(--rs);border:1px solid var(--b1);background:var(--s2);color:var(--t2);font-size:15px;font-weight:500;cursor:pointer;white-space:nowrap;transition:border-color .13s,color .13s}
.tool-btn:hover:not(:disabled){border-color:var(--b3);color:var(--t1)}
.tool-btn:disabled{opacity:.4;cursor:not-allowed}
.tool-end{margin-left:auto}
.link-btn{background:none;border:none;color:var(--acc);font-size:15px;font-weight:500;cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:6px 0}
.btn-danger{background:var(--rdd);border-color:rgba(255,90,69,.4);color:var(--red)}
.btn-danger:hover{background:rgba(255,90,69,.2)}
.upnext{color:var(--t2);font-family:var(--fb);font-size:14px}
.is-out{opacity:.5}

/* ───────── MODALS ───────── */
.modal-card{max-width:560px;display:flex;flex-direction:column;animation:none}
.rules{padding:6px 18px 20px}
.rules h3{font-size:16px;font-weight:600;color:var(--t1);margin:16px 0 4px}
.rules p{font-size:16px;color:var(--t2);line-height:1.55;max-width:62ch;margin-bottom:6px}
.players-list{max-height:min(46vh,420px);overflow-y:auto}
.qual-row{display:flex;align-items:center;gap:12px;padding:10px 18px;border-bottom:1px solid var(--b1)}
.qual-name{flex:1;min-width:0;font-size:16px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qual-bal{font-family:var(--fm);font-size:12px;white-space:nowrap}
.qual-status{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.qual-status.no{background:var(--rdd);color:var(--red)}
.row-actions{display:flex;gap:6px}
.players-add{padding:14px 18px 18px;border-top:1px solid var(--b1)}
.players-add .field-hint{margin-top:8px}

/* ───────── DISPLAY MODE ───────── */
.proj{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;flex-direction:column;padding:clamp(14px,3vw,40px);gap:clamp(12px,2.5vw,28px);overflow:auto}
.proj-top{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.proj-logo{font-family:var(--fd);font-size:clamp(28px,4vw,44px);letter-spacing:.16em;color:var(--acc);line-height:1}
.proj-phase{flex:1;font-size:clamp(18px,2.4vw,28px);color:var(--t2)}
.proj-body{flex:1;display:grid;grid-template-columns:minmax(0,1fr);gap:clamp(16px,3vw,40px);min-height:0}
@media (min-width:900px){.proj-body{grid-template-columns:minmax(0,1fr) clamp(300px,30vw,460px)}}
.proj-main{display:flex;flex-direction:column;justify-content:center;gap:clamp(14px,3vw,32px);min-width:0}
.proj-match{display:flex;align-items:center;justify-content:center;gap:clamp(12px,3vw,40px);flex-wrap:wrap;text-align:center}
.proj-side{flex:1 1 220px;min-width:0}
.proj-name{font-family:var(--fd);font-size:clamp(44px,9vw,132px);letter-spacing:.04em;line-height:1;overflow-wrap:anywhere}
.proj-name.dim{color:var(--t3)}
.proj-side.p1 .proj-bal{color:var(--p1)}
.proj-side.p2 .proj-bal{color:var(--p2)}
.proj-bal{font-family:var(--fm);font-size:clamp(22px,3.5vw,44px);margin-top:8px}
.proj-rec{font-size:clamp(16px,2vw,26px);color:var(--t3);margin-top:4px}
.proj-vs{font-family:var(--fd);font-size:clamp(28px,4vw,56px);color:var(--t3);letter-spacing:.1em}
.proj-pot{display:flex;align-items:baseline;justify-content:center;gap:clamp(14px,3vw,36px);font-family:var(--fd);font-size:clamp(32px,5vw,64px)}
.proj-pot .p1{color:var(--p1)}.proj-pot .p2{color:var(--p2)}
.proj-pot-lbl{font-family:var(--fb);font-size:clamp(15px,1.8vw,22px);color:var(--t3)}
.proj-next{text-align:center;font-size:clamp(17px,2.2vw,28px);color:var(--t2)}
.proj-table{background:var(--s1);border:1px solid var(--b1);border-radius:var(--rl);overflow:hidden;align-self:start}
.proj-table-hd{padding:12px 18px;font-size:clamp(17px,1.8vw,22px);font-weight:600;background:var(--s2);border-bottom:1px solid var(--b1)}
.proj-row{display:grid;grid-template-columns:34px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:11px 18px;border-bottom:1px solid var(--b1);font-size:clamp(17px,1.9vw,24px)}
.proj-row:last-child{border-bottom:none}
.proj-row:first-of-type{background:var(--acd)}
.proj-rank{font-family:var(--fm);font-size:.7em;color:var(--t3)}
.proj-pname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj-w{font-family:var(--fm);font-size:.7em;color:var(--t2)}
.proj-t{font-family:var(--fm);font-size:.7em;color:var(--teal);min-width:4.5em;text-align:right}

/* ───────── CONFETTI ───────── */
.confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.confetti span{position:absolute;top:-24px;border-radius:2px;opacity:.9;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.champ-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:560px;width:100%}

/* ───────── MOTION ───────── */
.fade{animation:fa .25s ease}
@keyframes fa{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}

/* ───────── RESPONSIVE ───────── */
@media (max-width:700px){
  .bet-item{grid-template-columns:minmax(0,1fr) auto;padding:12px 14px}
  .bet-item>.bet-item-right{grid-column:1/-1;grid-row:2}
  .bet-side-group{width:100%}
  .side-btn{flex:1;max-width:none;min-height:42px}
  .bet-amount-wrap{min-width:100%}
  .bet-num-inp,.bet-pct-btn{min-height:40px}
  .card-h,.ph,.pb,.lock-bar,.bet-row-lk,.bet-result-row{padding-left:14px;padding-right:14px}
  .lock-bar .btn{width:100%}
  .pot-s{padding:14px 10px}
}
@media (max-width:560px){
  .cfg{grid-template-columns:1fr}
  .setup-footer{flex-direction:column-reverse;align-items:stretch;text-align:center}
  .setup-footer .btn{width:100%}
  .app-logo{font-size:22px}
  .hdr-chip{padding:3px 8px;font-size:11px}
  .hdr-chips{gap:4px}
  .hdr-lbl{display:none}
  .match-vs{grid-template-columns:1fr}
  .result-actions{flex-direction:column-reverse}
  .result-actions .btn{width:100%}
  .champ-actions .btn{flex:1 1 100%}
  .champ-row{grid-template-columns:26px minmax(0,1fr) 52px 26px 26px 46px;padding:10px}
}
@media (max-width:380px){
  .hdr-chip.eco-ok,.hdr-chip.eco-hi,.hdr-chip.eco-warn{display:none}
  .st-wl{display:none}
}
@media (pointer:coarse){
  .chip-rm{width:34px;height:34px}
}
@media (prefers-reduced-motion:reduce){
  .confetti{display:none}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
